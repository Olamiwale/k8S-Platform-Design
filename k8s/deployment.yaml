apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-platform-app
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-platform-app
  template:
    metadata:
      labels:
        app: k8s-platform-app
    spec:
      containers:
        - name: app
          image: 234073095486.dkr.ecr.us-east-1.amazonaws.com/k8s-platform-app:v1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20